# CWP local stack. Supabase (auth + design-time data) stays hosted; these
# are CWP's own services. Entry point: http://localhost:${GATEWAY_PORT:-8080}
#   /            -> SPA (built from Designer/)
#   /api/runtime -> workflow-runtime (Flowable engine host)
#   /api/agent   -> agentic-designer (not built yet; returns 502 until it is)
name: cwp

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-^http://localhost:5173$$}
    depends_on:
      - workflow-runtime

  workflow-runtime:
    build: services/workflow-runtime
    environment:
      WORKFLOW_RUNTIME_DB_URL: jdbc:postgresql://runtime-db:5432/cwp_runtime?currentSchema=runtime
      WORKFLOW_RUNTIME_DB_USER: workflow_runtime
      WORKFLOW_RUNTIME_DB_PASSWORD: ${WORKFLOW_RUNTIME_DB_PASSWORD:?set WORKFLOW_RUNTIME_DB_PASSWORD in .env}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?set SUPABASE_JWKS_URL in .env}
      SUPABASE_JWT_MODE: ${SUPABASE_JWT_MODE:-jwks}
      SUPABASE_JWT_HS256_SECRET: ${SUPABASE_JWT_HS256_SECRET:-}
    depends_on:
      runtime-db:
        condition: service_healthy

  # The workflow runtime's own database (database-per-service). Holds the
  # `runtime` schema and Flowable's ACT_* tables. Not exposed to the host.
  runtime-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cwp_runtime
      POSTGRES_USER: workflow_runtime
      POSTGRES_PASSWORD: ${WORKFLOW_RUNTIME_DB_PASSWORD:?set WORKFLOW_RUNTIME_DB_PASSWORD in .env}
    volumes:
      - runtime-db-data:/var/lib/postgresql/data
      - ./services/workflow-runtime/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_runtime -d cwp_runtime"]
      interval: 5s
      retries: 10

volumes:
  runtime-db-data:
