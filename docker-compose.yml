# CWP local stack. Supabase (auth + design-time data) stays hosted; these
# are CWP's own services. Entry point: http://localhost:${GATEWAY_PORT:-8080}
#   /            -> SPA (built from Designer/)
#   /api/flowable -> flowable-wrapper (Flowable engine host)
#   /api/identity -> identity-service (login, members, groups, invites; issues RS256 tokens)
#   /api/design   -> design-service (workflows, versions, approvals, audit log)
#   /api/agent   -> agentic-designer (LLM-assisted authoring)
#   /api/spend   -> spend-tracker (API spend and key health; POST /events is internal only)
name: cwp

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-^http://localhost:5173$$}
    depends_on:
      - identity-service
      - design-service
      - flowable-wrapper
      - agentic-designer
      - spend-tracker

  flowable-wrapper:
    build: services/flowable-wrapper
    environment:
      # Own role (Database/roles.sql): the runtime schema only.
      WORKFLOW_RUNTIME_DB_URL: jdbc:postgresql://runtime-db:5432/cwp_runtime?currentSchema=runtime
      WORKFLOW_RUNTIME_DB_USER: cwp_runtime
      WORKFLOW_RUNTIME_DB_PASSWORD: ${CWP_RUNTIME_DB_PASSWORD:?set CWP_RUNTIME_DB_PASSWORD in .env}
      # Tokens come from identity-service; role/status/groups are looked up there too.
      IDENTITY_SERVICE_URL: http://identity-service:8082
      IDENTITY_JWKS_URL: http://identity-service:8082/.well-known/jwks.json
      CWP_INTERNAL_TOKEN: ${CWP_INTERNAL_TOKEN:?set CWP_INTERNAL_TOKEN in .env}
    depends_on:
      runtime-db:
        condition: service_healthy
      identity-service:
        condition: service_started

  design-service:
    build: services/design-service
    environment:
      # Own role (Database/roles.sql): workflows, versions, approvals, audit_logs only.
      DESIGN_DB_URL: jdbc:postgresql://runtime-db:5432/cwp_runtime?currentSchema=public
      DESIGN_DB_USER: cwp_design
      DESIGN_DB_PASSWORD: ${CWP_DESIGN_DB_PASSWORD:?set CWP_DESIGN_DB_PASSWORD in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8082
      IDENTITY_JWKS_URL: http://identity-service:8082/.well-known/jwks.json
      CWP_INTERNAL_TOKEN: ${CWP_INTERNAL_TOKEN:?set CWP_INTERNAL_TOKEN in .env}
    depends_on:
      runtime-db:
        condition: service_healthy
      identity-service:
        condition: service_started

  identity-service:
    build: services/identity-service
    environment:
      # Own role (Database/roles.sql): users, tenants, profiles, groups, invites only.
      IDENTITY_DB_URL: jdbc:postgresql://runtime-db:5432/cwp_runtime?currentSchema=public
      IDENTITY_DB_USER: cwp_identity
      IDENTITY_DB_PASSWORD: ${CWP_IDENTITY_DB_PASSWORD:?set CWP_IDENTITY_DB_PASSWORD in .env}
      DESIGN_SERVICE_URL: http://design-service:8083
      # PKCS#8 PEM. Unset: a throwaway key per start (everyone is logged out on restart).
      CWP_JWT_PRIVATE_KEY: ${CWP_JWT_PRIVATE_KEY:-}
      CWP_INTERNAL_TOKEN: ${CWP_INTERNAL_TOKEN:?set CWP_INTERNAL_TOKEN in .env}
    depends_on:
      runtime-db:
        condition: service_healthy

  agentic-designer:
    build: services/agentic-designer
    environment:
      # Login tokens are RS256, verified against identity-service's key set.
      SUPABASE_JWKS_URL: http://identity-service:8082/.well-known/jwks.json
      # gemini | nvidia | openrouter. Without the chosen provider's key the
      # service still starts and /generate returns 503.
      AGENT_PROVIDER: ${AGENT_PROVIDER:-gemini}
      AGENT_MODEL: ${AGENT_MODEL:-}
      # Optional separate model for Edit mode (AgenticDesigner.html Section 4b).
      AGENT_EDIT_MODEL: ${AGENT_EDIT_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_TENANT_RPM: ${AGENT_TENANT_RPM:-10}
      # Grounding in the tenant's own workflows (AgenticDesigner.html A5). The
      # agent reads Supabase as the logged-in user, so RLS scopes every query.
      AGENT_GROUNDING: ${AGENT_GROUNDING:-off}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      AGENT_EMBED_PROVIDER: ${AGENT_EMBED_PROVIDER:-nvidia}
      AGENT_EMBED_MODEL: ${AGENT_EMBED_MODEL:-}
      # Usage events go here over the internal network (SpendTracker.html S1).
      SPEND_TRACKER_URL: http://spend-tracker:8095
      SPEND_INGEST_TOKEN: ${SPEND_INGEST_TOKEN:?set SPEND_INGEST_TOKEN in .env}

  spend-tracker:
    build: services/spend-tracker
    environment:
      SPEND_DATABASE_URL: postgresql://spend_tracker:${SPEND_DB_PASSWORD:?set SPEND_DB_PASSWORD in .env}@spend-db:5432/cwp_spend
      # Login tokens are RS256, verified against identity-service's key set.
      SUPABASE_JWKS_URL: http://identity-service:8082/.well-known/jwks.json
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SPEND_INGEST_TOKEN: ${SPEND_INGEST_TOKEN:?set SPEND_INGEST_TOKEN in .env}
      # Comma-separated Supabase user ids allowed platform-wide spend and key health.
      SPEND_ADMIN_USER_IDS: ${SPEND_ADMIN_USER_IDS:-}
      SPEND_KEY_CHECK_INTERVAL_S: ${SPEND_KEY_CHECK_INTERVAL_S:-3600}
      # Only the keys the tracker checks; never the whole secrets file.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TYPESAFE_JEV_API_KEY: ${TYPESAFE_JEV_API_KEY:-}
    depends_on:
      spend-db:
        condition: service_healthy

  # The spend tracker's own database (database-per-service).
  spend-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cwp_spend
      POSTGRES_USER: spend_tracker
      POSTGRES_PASSWORD: ${SPEND_DB_PASSWORD:?set SPEND_DB_PASSWORD in .env}
    volumes:
      - spend-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend_tracker -d cwp_spend"]
      interval: 5s
      retries: 10

  # The workflow runtime's own database (database-per-service). Holds the
  # `runtime` schema and Flowable's ACT_* tables. Not exposed to the host.
  runtime-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cwp_runtime
      POSTGRES_USER: workflow_runtime
      POSTGRES_PASSWORD: ${WORKFLOW_RUNTIME_DB_PASSWORD:?set WORKFLOW_RUNTIME_DB_PASSWORD in .env}
      CWP_IDENTITY_DB_PASSWORD: ${CWP_IDENTITY_DB_PASSWORD:?set CWP_IDENTITY_DB_PASSWORD in .env}
      CWP_DESIGN_DB_PASSWORD: ${CWP_DESIGN_DB_PASSWORD:?set CWP_DESIGN_DB_PASSWORD in .env}
      CWP_RUNTIME_DB_PASSWORD: ${CWP_RUNTIME_DB_PASSWORD:?set CWP_RUNTIME_DB_PASSWORD in .env}
    volumes:
      - runtime-db-data:/var/lib/postgresql/data
      # First start builds the schema, seed users and per-service roles.
      - ./Database/docker-initdb:/docker-entrypoint-initdb.d:ro
      - ./Database:/cwp-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_runtime -d cwp_runtime"]
      interval: 5s
      retries: 10

volumes:
  runtime-db-data:
  spend-db-data:
