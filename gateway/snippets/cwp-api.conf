# Shared by every /api/* location in templates/cwp.conf.template.
# add_header here replaces (not extends) the server-level set, so the
# request id header is repeated.
add_header X-Request-Id $cwp_request_id always;
add_header Access-Control-Allow-Origin $cwp_cors_origin always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
add_header Access-Control-Max-Age 600 always;
add_header Vary Origin always;

# CORS preflight never reaches a service (it carries no Authorization header,
# so every service would reject it with 401).
if ($request_method = OPTIONS) {
  return 204;
}

proxy_set_header Host $host;
proxy_set_header X-Request-Id $cwp_request_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Services must not set their own CORS headers; nginx owns them.
proxy_hide_header Access-Control-Allow-Origin;
