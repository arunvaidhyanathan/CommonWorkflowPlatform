[project]
name = "agentic-designer"
version = "0.1.0"
description = "CWP Agentic Designer: LLM-proposed workflow changes, validated by code"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_designer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
