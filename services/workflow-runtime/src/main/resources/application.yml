# Workflow Runtime configuration. Every secret-shaped value is env-var driven
# with a local-dev-only fallback -- nothing here is a real credential.
# See README.md for what each of these needs to be set to for a real run.
spring:
  application:
    name: workflow-runtime

  datasource:
    # Point this at the SAME Supabase Postgres project's direct connection
    # string (Project Settings -> Database -> Connection string -> JDBC),
    # not the anon-key/PostgREST URL the frontend uses. currentSchema scopes
    # the JDBC session's search_path to `runtime` so unqualified table names
    # in JPA/Liquibase resolve correctly without touching the `public`
    # schema the Supabase-facing frontend owns.
    url: ${WORKFLOW_RUNTIME_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=runtime}
    username: ${WORKFLOW_RUNTIME_DB_USER:runtime_gateway_service}
    password: ${WORKFLOW_RUNTIME_DB_PASSWORD:}

  jpa:
    hibernate:
      # validate, not update/create -- Liquibase owns schema changes (see
      # db/changelog). The application should never silently alter the
      # schema it depends on.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: runtime

  liquibase:
    # NOTE (WorkflowWrapper.html Section 10): Flowable itself uses Liquibase
    # internally to manage its own engine tables, and sets
    # spring.liquibase.enabled=false BY DEFAULT specifically so a host
    # app's own Liquibase setup doesn't get tangled with its internal one.
    # This explicit `true` is what makes OUR changelog below actually run;
    # per Flowable's own docs this should not affect Flowable's own
    # (separate, internal) schema management, but that interaction has
    # never been observed running -- confirm on first real boot.
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Where Liquibase applies changes AND where it creates its own
    # DATABASECHANGELOG/DATABASECHANGELOGLOCK tracking tables -- keeps
    # everything Liquibase-related inside `runtime`, out of the
    # Supabase-owned `public` schema entirely.
    default-schema: runtime
    liquibase-schema: runtime

  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase Auth's JWKS endpoint, if this project has asymmetric
          # (RS256/ES256) signing keys enabled. If this project still signs
          # with the legacy shared HS256 secret instead, this property does
          # not apply -- see SecurityConfig.java's javadoc for the
          # alternative NimbusJwtDecoder.withSecretKey(...) wiring and set
          # supabase.jwt.mode: hs256 below instead.
          jwk-set-uri: ${SUPABASE_JWKS_URL:https://nrhsoabqeskybrznxfyi.supabase.co/auth/v1/.well-known/jwks.json}

# Flowable 8.0.0 (WorkflowWrapper.html Section 5): embedded Process/CMMN/
# DMN/IDM engines, in the same datasource/connection as `runtime` above.
# Flowable manages its own ACT_*-prefixed tables independently of the
# Liquibase changelog above -- no collision, just two schema-management
# mechanisms sharing one Postgres connection.
flowable:
  # Let Flowable create/update its own tables on boot. There is no
  # separate migration step for Flowable's own schema the way there is for
  # `runtime.deployments` -- this is Flowable's own established mechanism,
  # not something this project manages.
  database-schema-update: true
  # This service deploys BPMN/CMMN/DMN definitions from API request bodies
  # (the manifest in POST /runtime/deployments), never from classpath
  # folders -- disable Flowable's own auto-deploy-on-boot scanning so
  # nothing unexpected gets deployed from a stray `processes`/`cases`/`dmn`
  # folder on the classpath.
  check-process-definitions: false
  cmmn:
    deploy-resources: false
  dmn:
    deploy-resources: false

# Custom properties read by SecurityConfig.java.
supabase:
  jwt:
    # Tokens signed with a JWKS key are always accepted. HS256 tokens (the
    # project's legacy shared key) are checked with this when set, else by
    # Supabase Auth using url and anon-key below.
    hs256-secret: ${SUPABASE_JWT_HS256_SECRET:}
  url: ${SUPABASE_URL:}
  anon-key: ${SUPABASE_ANON_KEY:}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
