[project]
name = "spend-tracker"
version = "0.1.0"
description = "CWP API spend tracker: metered usage events and API key health"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt[crypto]>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spend_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
