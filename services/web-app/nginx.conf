# web-app: serves the built Designer SPA. Runs on nginx-unprivileged (any UID,
# port 8080), so it fits OpenShift's restricted security context. The gateway
# routes every non-/api path here; this container never talks to the API.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Hashed filenames: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached, so a new release takes effect at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routes fall back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
