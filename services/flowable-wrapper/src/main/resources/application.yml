# Workflow Runtime configuration. Every secret-shaped value is env-var driven
# with a local-dev-only fallback -- nothing here is a real credential.
# See README.md for what each of these needs to be set to for a real run.
spring:
  application:
    name: flowable-wrapper

  datasource:
    # Local Postgres (Database/local.sql creates the `cwp` database's
    # schemas). search_path is `runtime` first, so JPA/Liquibase/Flowable
    # create their tables there; `public` second, so the design-time triggers
    # (policies.sql) resolve their unqualified helper functions.
    url: ${WORKFLOW_RUNTIME_DB_URL:jdbc:postgresql://localhost:5432/cwp?currentSchema=runtime,public}
    username: ${WORKFLOW_RUNTIME_DB_USER:${USER}}
    password: ${WORKFLOW_RUNTIME_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${WORKFLOW_RUNTIME_DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # validate, not update/create -- Liquibase owns schema changes (see
      # db/changelog). The application should never silently alter the
      # schema it depends on.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: runtime

  liquibase:
    # NOTE (WorkflowWrapper.html Section 10): Flowable itself uses Liquibase
    # internally to manage its own engine tables, and sets
    # spring.liquibase.enabled=false BY DEFAULT specifically so a host
    # app's own Liquibase setup doesn't get tangled with its internal one.
    # This explicit `true` is what makes OUR changelog below actually run;
    # per Flowable's own docs this should not affect Flowable's own
    # (separate, internal) schema management, but that interaction has
    # never been observed running -- confirm on first real boot.
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Where Liquibase applies changes AND where it creates its own
    # DATABASECHANGELOG/DATABASECHANGELOGLOCK tracking tables -- keeps
    # everything Liquibase-related inside `runtime`, out of the
    # Supabase-owned `public` schema entirely.
    default-schema: runtime
    liquibase-schema: runtime

# Flowable 8.0.0 (WorkflowWrapper.html Section 5): embedded Process/CMMN/
# DMN/IDM engines, in the same datasource/connection as `runtime` above.
# Flowable manages its own ACT_*-prefixed tables independently of the
# Liquibase changelog above -- no collision, just two schema-management
# mechanisms sharing one Postgres connection.
flowable:
  # History (#11): "audit" keeps instances, steps and final variable values;
  # "full" also keeps every variable change (the instance timeline shows them).
  history-level: ${CWP_HISTORY_LEVEL:audit}
  # Optional history cleanup: delete finished instances' history after the
  # retention period, on the given cron cycle.
  enable-history-cleaning: ${CWP_HISTORY_CLEANING:false}
  history-cleaning-after: ${CWP_HISTORY_RETENTION:365d}
  history-cleaning-cycle: "${CWP_HISTORY_CLEANING_CYCLE:0 0 1 * * ?}"
  # Async executor (#14): runs timers, async steps and batch parts.
  async-executor-activate: ${CWP_ASYNC_EXECUTOR:true}
  process:
    async:
      executor:
        max-async-jobs-due-per-acquisition: ${CWP_ASYNC_JOBS_PER_ACQUISITION:16}
        async-job-lock-time: ${CWP_ASYNC_JOB_LOCK_TIME:PT5M}
  # Mail tasks (#6). Point at a real SMTP relay outside local development.
  mail:
    server:
      host: ${CWP_MAIL_HOST:localhost}
      port: ${CWP_MAIL_PORT:2525}
      default-from: ${CWP_MAIL_FROM:workflow@cwp.local}
  # Let Flowable create/update its own tables on boot. There is no
  # separate migration step for Flowable's own schema the way there is for
  # `runtime.deployments` -- this is Flowable's own established mechanism,
  # not something this project manages.
  database-schema-update: true
  # This service deploys BPMN/CMMN/DMN definitions from API request bodies
  # (the manifest in POST /runtime/deployments), never from classpath
  # folders -- disable Flowable's own auto-deploy-on-boot scanning so
  # nothing unexpected gets deployed from a stray `processes`/`cases`/`dmn`
  # folder on the classpath.
  check-process-definitions: false
  cmmn:
    deploy-resources: false
  dmn:
    deploy-resources: false

# Read by SecurityConfig.java / AuthController.java. flowable-wrapper signs
# login tokens with this HS256 secret; agentic-designer and spend-tracker
# verify them with the same value (their SUPABASE_JWT_HS256_SECRET). The
# fallback is for local development only -- set CWP_JWT_SECRET anywhere else.
cwp:
  # Script tasks/listeners run arbitrary code in this shared JVM; off unless a
  # platform operator enables them (deployment/ScriptPolicy.java).
  scripts:
    enabled: ${CWP_SCRIPTS_ENABLED:false}
  jwt:
    secret: ${CWP_JWT_SECRET:local-dev-only-cwp-jwt-secret-change-me-0123456789}
    ttl: ${CWP_JWT_TTL:PT8H}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
