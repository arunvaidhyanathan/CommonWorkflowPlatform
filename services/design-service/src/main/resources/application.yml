# design-service configuration. Every secret-shaped value is env-var driven
# with a local-dev-only fallback -- nothing here is a real credential.
spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  application:
    name: design-service

  datasource:
    # The design tables (design.workflows, workflow_versions,
    # approval_requests, audit_logs) share the local `cwp` database with the
    # other services, but the cwp_design role can reach only these
    # (database/00-roles.sql). The audit and status triggers (database/03-design.sql) run
    # here and read request.jwt.claims.
    url: ${DESIGN_DB_URL:jdbc:postgresql://localhost:5432/cwp?currentSchema=design}
    username: ${DESIGN_DB_USER:cwp_design}
    password: ${DESIGN_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DESIGN_DB_POOL_SIZE:5}

cwp:
  # identity-service issues login tokens (verified here against its JWKS)
  # and answers role/status lookups (IdentityClient.java).
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8082}
    jwks-url: ${IDENTITY_JWKS_URL:http://localhost:8082/.well-known/jwks.json}
    # How long a member lookup is reused: the most a role change or
    # deactivation can lag behind for design writes.
    cache-ttl: ${IDENTITY_CACHE_TTL:PT30S}
  # Presented to identity-service's /internal/** endpoints.
  internal-token: ${CWP_INTERNAL_TOKEN:}

server:
  port: ${PORT:8083}
  # Finish in-flight requests before stopping (rolling deploys, scale-in).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # /actuator/health/liveness and /actuator/health/readiness for OpenShift probes.
  endpoint:
    health:
      probes:
        enabled: true
